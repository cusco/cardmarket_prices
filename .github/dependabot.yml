version: 2
updates:
  # Version-update PRs are switched off on purpose (open-pull-requests-limit: 0): routine bumps were noisy and not
  # wanted. This does NOT affect Dependabot security updates, which ignore this limit and are controlled by the
  # repo's Security settings instead. The file is kept so the intent is written down, and the retired project's pins
  # live in old/requirements.txt.frozen so they are never picked up as a live manifest.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
